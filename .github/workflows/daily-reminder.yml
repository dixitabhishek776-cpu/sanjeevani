name: Daily check-in reminder emails

on:
  schedule:
    # 13:00 UTC = 6:30 PM IST — adjust as preferred
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # lets you manually trigger a test run from the Actions tab

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sqlalchemy psycopg2-binary requests
      - run: python scripts/send_daily_reminders.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
