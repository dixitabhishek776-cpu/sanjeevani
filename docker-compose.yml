services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sanjeevani_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sanjeevani
      POSTGRES_PASSWORD: sanjeevani
      POSTGRES_DB: sanjeevani
    ports:
      - "5432:5432"
    volumes:
      - sanjeevani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanjeevani"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://sanjeevani:sanjeevani@db:5432/sanjeevani
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SANJEEVANI_ENCRYPTION_PROVIDER: ${SANJEEVANI_ENCRYPTION_PROVIDER:-local_dev}
      SANJEEVANI_MASTER_KEY: ${SANJEEVANI_MASTER_KEY}
      SANJEEVANI_KMS_KEY_ID: ${SANJEEVANI_KMS_KEY_ID}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SANJEEVANI_JWT_SECRET: ${SANJEEVANI_JWT_SECRET}
      SANJEEVANI_ENV: ${SANJEEVANI_ENV:-development}
      SANJEEVANI_CORS_ORIGINS: ${SANJEEVANI_CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
      SANJEEVANI_RATE_LIMIT: ${SANJEEVANI_RATE_LIMIT:-30}
      SANJEEVANI_RATE_WINDOW: ${SANJEEVANI_RATE_WINDOW:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-worker:
    build:
      context: ./backend
      dockerfile: worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://sanjeevani:sanjeevani@db:5432/sanjeevani
      SANJEEVANI_ENCRYPTION_PROVIDER: ${SANJEEVANI_ENCRYPTION_PROVIDER:-local_dev}
      SANJEEVANI_MASTER_KEY: ${SANJEEVANI_MASTER_KEY}
      SANJEEVANI_KMS_KEY_ID: ${SANJEEVANI_KMS_KEY_ID}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SANJEEVANI_SMTP_HOST: ${SANJEEVANI_SMTP_HOST}
      SANJEEVANI_SMTP_PORT: ${SANJEEVANI_SMTP_PORT:-587}
      SANJEEVANI_SMTP_TLS: ${SANJEEVANI_SMTP_TLS:-1}
      SANJEEVANI_SMTP_USER: ${SANJEEVANI_SMTP_USER}
      SANJEEVANI_SMTP_PASSWORD: ${SANJEEVANI_SMTP_PASSWORD}
      SANJEEVANI_SMTP_FROM: ${SANJEEVANI_SMTP_FROM}
      SANJEEVANI_ALERT_WEBHOOK_URL: ${SANJEEVANI_ALERT_WEBHOOK_URL}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sanjeevani_pgdata:
  sanjeevani_redis:
